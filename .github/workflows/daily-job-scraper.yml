name: Daily Job Scraper

on:
  schedule:
    # 06:00 Dubai (UTC+4, no daylight saving) = 02:00 UTC.
    # GitHub cron is always UTC; scheduled runs can start a few minutes late under load.
    - cron: "0 2 * * *"
  workflow_dispatch: # Manual trigger from the Actions tab

permissions:
  contents: write # needed to push the updated listings

concurrency:
  group: daily-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT_FILE: jobs/linkedin.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The script loads Playwright from the global npm root, so install it globally.
      # The site's own dependencies (Next.js etc.) aren't needed for this job.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          playwright install --with-deps chromium

      - name: Run job scraper
        run: |
          mkdir -p "$(dirname "$OUT_FILE")"
          # Third argument is the previous results, so jobs are remembered between runs.
          node scripts/linkedin-jobs.cjs /tmp/linkedin.json 40 "$OUT_FILE"

      # Don't save a run that found nothing (e.g. LinkedIn blocked the runner) - keep the previous file.
      - name: Validate result
        run: |
          SEEN=$(node -p "require('/tmp/linkedin.json').seenThisRun")
          BLOCKED=$(node -p "require('/tmp/linkedin.json').blocked")
          echo "Jobs seen this run: $SEEN (blocked=$BLOCKED)"
          if [ "$SEEN" -eq 0 ]; then
            echo "::error::No jobs scraped (blocked=$BLOCKED). Keeping the previous $OUT_FILE."
            exit 1
          fi
          if [ "$BLOCKED" = "true" ]; then
            echo "::warning::LinkedIn rate-limited the run partway through; results are partial."
          fi
          mv /tmp/linkedin.json "$OUT_FILE"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update job listings $(TZ=Asia/Dubai date '+%Y-%m-%d') [skip ci]"
          git pull --rebase
          git push
